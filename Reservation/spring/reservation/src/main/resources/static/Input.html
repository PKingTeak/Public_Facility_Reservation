<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>시설 예약 시스템</title>
</head>

<body onload="loadFacilities()">

    <h1>시설 예약</h1>

    <!-- =========================
         예약 영역
    ========================== -->

    <div>
        <label for="nameInput">예약자 이름</label>
        <input type="text" id="nameInput" placeholder="이름을 입력하세요">
    </div>

    <br>

    <div>
        <label for="facilitySelect">시설 선택</label>

        <select id="facilitySelect">
            <option value="">시설을 선택하세요</option>
        </select>
    </div>

    <br>

    <div>
        <label for="reservationDate">예약 날짜</label>

        <input type="date" id="reservationDate" onchange="showTimeSelect()">
    </div>

    <br>

    <!-- 날짜를 선택하면 표시 -->
    <div id="timeSelectArea" style="display: none;">

        <label for="startTime">시작시간</label>

        <select id="startTime">
            <option value="">시작시간 선택</option>

            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
        </select>

        <span> ~ </span>

        <label for="endTime">종료시간</label>

        <select id="endTime">
            <option value="">종료시간 선택</option>

            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="17:00">17:00</option>
            <option value="18:00">18:00</option>
            <option value="19:00">19:00</option>
        </select>

    </div>

    <br>

    <button onclick="addReservation()">
        예약하기
    </button>

    <p id="reservationResult"></p>


    <hr>


    <!-- =========================
         회원가입 영역
    ========================== -->

    <h2>회원가입</h2>

    <div>
        <input type="text" id="newNameInput" placeholder="이름">

        <input type="number" id="age" placeholder="나이">

        <button onclick="newMemberShip()">
            회원가입
        </button>

        <p id="registerResult"></p>
    </div>

    <hr>

    <h2>예약 취소</h2>

    <div>
        <label for="cancelDate">예약 날짜 선택</label>

        <input type="date" id="cancelDate" onchange="loadReservationsByDate()">
    </div>

    <br>

    <div id="reservationList">
        <!-- 선택한 날짜의 예약 목록이 여기에 생성됨 -->
    </div>

    <p id="cancelResult"></p>



    <script>

        // ==================================================
        // 시설 전체 조회
        // GET /facility
        // ==================================================

        function loadFacilities() {
            fetch("/facility")

                .then(response => response.json())

                .then(data => {

                    const select =
                        document.getElementById("facilitySelect");


                    data.forEach(facility => {

                        const option =
                            document.createElement("option");


                        // 서버에서 사용할 시설 ID
                        option.value =
                            facility.facilityId;


                        // 화면에 보여줄 시설 이름
                        option.textContent =
                            facility.facilityName;


                        select.appendChild(option);
                    });

                })

                .catch(error => {

                    console.error(
                        "시설 조회 실패:",
                        error
                    );

                });
        }



        // ==================================================
        // 날짜 선택 시 시간 메뉴 표시
        // ==================================================

        function showTimeSelect() {
            const date =
                document.getElementById(
                    "reservationDate"
                ).value;


            const timeArea =
                document.getElementById(
                    "timeSelectArea"
                );


            if (date !== "") {
                timeArea.style.display = "block";
            }
            else {
                timeArea.style.display = "none";
            }
        }



        // ==================================================
        // 예약
        // ==================================================

        function addReservation() {
            // HTML에서 예약 정보 읽기
            const name =
                document.getElementById(
                    "nameInput"
                ).value;


            const facilityId =
                document.getElementById(
                    "facilitySelect"
                ).value;


            const date =
                document.getElementById(
                    "reservationDate"
                ).value;


            const startTime =
                document.getElementById(
                    "startTime"
                ).value;


            const endTime =
                document.getElementById(
                    "endTime"
                ).value;



            // 입력 확인
            if (
                name === "" ||
                facilityId === "" ||
                date === "" ||
                startTime === "" ||
                endTime === ""
            ) {
                document.getElementById(
                    "reservationResult"
                ).innerText =
                    "예약 정보를 모두 입력해주세요.";

                return;
            }



            // ==============================================
            // 이름 → User ID 조회
            //
            // GET /users/id?name=홍길동
            // ==============================================

            fetch(
                "/users/id-by-name?username="
                + encodeURIComponent(name)
            )

                .then(response => {

                    if (!response.ok) {
                        throw new Error(
                            "USER_NOT_FOUND"
                        );
                    }


                    // 서버가 long 값 하나를 반환
                    return response.json();
                })


                // ==============================================
                // User ID 조회 성공
                // → 예약 POST 요청
                // ==============================================

                .then(userId => {

                    return fetch(
                        "/reservation",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                userId:
                                    Number(userId),

                                facilityId:
                                    Number(facilityId),

                                date:
                                    date,

                                startTime:
                                    startTime,

                                endTime:
                                    endTime
                            })
                        }
                    );

                })


                // ==============================================
                // 예약 결과 처리
                // ==============================================

                .then(response => {

                    if (response.ok) {
                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "예약이 완료되었습니다.";
                    }
                    else {
                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "예약에 실패했습니다.";
                    }

                })


                // ==============================================
                // User가 없거나 통신 실패
                // ==============================================

                .catch(error => {

                    if (
                        error.message ===
                        "USER_NOT_FOUND"
                    ) {
                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "등록되지 않은 사용자입니다. 회원가입을 진행해주세요.";


                        // 입력한 이름을
                        // 회원가입 칸에 자동으로 넣기
                        document.getElementById(
                            "newNameInput"
                        ).value =
                            name;
                    }
                    else {
                        console.error(
                            "예약 오류:",
                            error
                        );


                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "서버 요청 중 오류가 발생했습니다.";
                    }

                });
        }



        // ==================================================
        // 회원가입
        //
        // POST /users
        // ==================================================

        function newMemberShip() {
            const name =
                document.getElementById(
                    "newNameInput"
                ).value;


            const age =
                document.getElementById(
                    "age"
                ).value;



            if (
                name === "" ||
                age === ""
            ) {
                document.getElementById(
                    "registerResult"
                ).innerText =
                    "이름과 나이를 입력해주세요.";

                return;
            }



            fetch(
                "/users",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        name:
                            name,

                        age:
                            Number(age)
                    })
                }
            )

                .then(response => {

                    if (response.ok) {
                        document.getElementById(
                            "registerResult"
                        ).innerText =
                            "회원가입 성공";


                        // 가입한 이름을
                        // 예약자 이름 칸에 자동으로 넣기
                        document.getElementById(
                            "nameInput"
                        ).value =
                            name;
                    }
                    else {
                        document.getElementById(
                            "registerResult"
                        ).innerText =
                            "회원가입 실패";
                    }

                })

                .catch(error => {

                    console.error(
                        "회원가입 오류:",
                        error
                    );


                    document.getElementById(
                        "registerResult"
                    ).innerText =
                        "서버 요청 자체가 실패했습니다.";

                });
        }



        // ==========================================
// 선택한 날짜의 예약 목록 조회
// ==========================================

function loadReservationsByDate()
{
    const date =
        document.getElementById("cancelDate").value;

    const list =
        document.getElementById("reservationList");


    // 기존 목록 초기화
    list.innerHTML = "";


    if (date === "")
    {
        return;
    }


    fetch("/reservation/" + date)

        .then(response => {

            if (!response.ok)
            {
                throw new Error("예약 조회 실패");
            }

            return response.json();
        })

        .then(data => {

            // 해당 날짜에 예약이 하나도 없는 경우
            if (data.length === 0)
            {
                list.innerText =
                    "해당 날짜에 예약이 없습니다.";

                return;
            }


            data.forEach(reservation => {

                // 이미 취소된 예약은 표시하지 않음
                if (reservation.status === "CANCELLED")
                {
                    return;
                }


                const button =
                    document.createElement("button");


                // 화면에 표시할 내용
                button.textContent =
                    reservation.reservationFacilityName
                    + " / "
                    + reservation.reservationUserName
                    + " / "
                    + reservation.startTime
                    + " : "
                    + reservation.endTime


                // 버튼 클릭 → 해당 예약 취소
                button.onclick = function()
                {
                    cancelReservation(
                        date,
                        reservation.reservationId
                    );
                };


                list.appendChild(button);
                list.appendChild(
                    document.createElement("br")
                );
            });

        })

        .catch(error => {

            console.error(error);

            list.innerText =
                "예약 목록을 불러오지 못했습니다.";

        });
}



// ==========================================
// 예약 취소
// ==========================================

function cancelReservation(date, reservationId)
{
    const result =
        document.getElementById("cancelResult");


    fetch(
        "/reservation/"
        + date
        + "/"
        + reservationId,
        {
            method: "DELETE"
        }
    )

    .then(response => {

        if (response.ok)
        {
            result.innerText =
                "예약이 취소되었습니다.";


            // 취소 후 목록 다시 불러오기
            loadReservationsByDate();
        }
        else
        {
            result.innerText =
                "예약 취소에 실패했습니다.";
        }

    })

    .catch(error => {

        console.error(error);

        result.innerText =
            "서버 요청 중 오류가 발생했습니다.";

    });
}
    </script>

</body>

</html>
