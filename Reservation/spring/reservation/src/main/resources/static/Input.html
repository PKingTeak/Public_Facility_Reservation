<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>시설 예약 시스템</title>

    <style>
        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            max-width: 850px;
            margin-bottom: 18px;
        }

        .time-block {
            min-height: 56px;
            padding: 8px;
            border: 1px solid #999;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            white-space: pre-line;
        }

        .time-block.selected {
            border: 2px solid #222;
            font-weight: bold;
        }

        .time-block:disabled {
            background: #e8e8e8;
            cursor: not-allowed;
            opacity: 0.85;
        }
    </style>

</head>

<body onload="loadFacilities()">

    <h1>시설 예약</h1>

    <!-- =========================
         예약 영역
    ========================== -->

    <div>
        <label for="nameInput">예약자 이름</label>
        <input type="text" id="nameInput" placeholder="이름을 입력하세요">
    </div>

    <br>

    <div>
        <label for="facilitySelect">시설 선택</label>

        <select id="facilitySelect" onchange="loadTimeBlocks()">
            <option value="">시설을 선택하세요</option>
        </select>
    </div>

    <br>

    <div>
        <label for="reservationDate">예약 날짜</label>

        <input type="date" id="reservationDate" onchange="loadTimeBlocks()">
    </div>

    <br>

    <!-- 시설 + 날짜를 선택하면 1시간 단위 예약 블록 표시 -->
    <div id="timeSelectArea" style="display: none;">
        <h3>시작 시간</h3>
        <div id="startTimeBlocks" class="time-grid"></div>

        <h3>끝나는 시간</h3>
        <div id="endTimeBlocks" class="time-grid"></div>

        <p id="selectedTimeSummary">시간을 선택해주세요.</p>
    </div>

    <br>

    <button onclick="addReservation()">
        예약하기
    </button>

    <p id="reservationResult"></p>


    <hr>


    <!-- =========================
         회원가입 영역
    ========================== -->

    <h2>회원가입</h2>

    <div>
        <input type="text" id="newNameInput" placeholder="이름">

        <input type="number" id="age" placeholder="나이">

        <button onclick="newMemberShip()">
            회원가입
        </button>

        <p id="registerResult"></p>
    </div>

    <hr>

    <h2>예약 취소</h2>

    <div>
        <label for="cancelDate">예약 날짜 선택</label>

        <input type="date" id="cancelDate" onchange="loadReservationsByDate()">
    </div>

    <br>

    <div id="reservationList">
        <!-- 선택한 날짜의 예약 목록이 여기에 생성됨 -->
    </div>

    <p id="cancelResult"></p>



    <script>

        // ==================================================
        // 시설 전체 조회
        // GET /facility
        // ==================================================

        function loadFacilities() {
            fetch("/facility")

                .then(response => response.json())

                .then(data => {

                    const select =
                        document.getElementById("facilitySelect");


                    data.forEach(facility => {

                        const option =
                            document.createElement("option");


                        // 서버에서 사용할 시설 ID
                        option.value =
                            facility.facilityId;


                        // 화면에 보여줄 시설 이름
                        option.textContent =
                            facility.facilityName;


                        select.appendChild(option);
                    });

                })

                .catch(error => {

                    console.error(
                        "시설 조회 실패:",
                        error
                    );

                });
        }



        // ==================================================
        // 1시간 단위 시간 블록
        // ==================================================

        let selectedStartTime = "";
        let selectedEndTime = "";
        let currentFacilityReservations = [];

        function hourText(hour) {
            return String(hour).padStart(2, "0") + ":00";
        }

        function timeToMinutes(time) {
            const parts = time.split(":");
            return Number(parts[0]) * 60 + Number(parts[1]);
        }

        function overlaps(startA, endA, startB, endB) {
            return timeToMinutes(startA) < timeToMinutes(endB)
                && timeToMinutes(endA) > timeToMinutes(startB);
        }

        function loadTimeBlocks() {
            const facilityId = document.getElementById("facilitySelect").value;
            const date = document.getElementById("reservationDate").value;
            const area = document.getElementById("timeSelectArea");

            selectedStartTime = "";
            selectedEndTime = "";
            currentFacilityReservations = [];

            if (facilityId === "" || date === "") {
                area.style.display = "none";
                return;
            }

            area.style.display = "block";

            fetch("/reservation/" + date)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("예약 조회 실패");
                    }

                    return response.json();
                })
                .then(data => {
                    currentFacilityReservations = data.filter(reservation =>
                        reservation.status !== "CANCELLED"
                        && Number(reservation.reservationFacilityId) === Number(facilityId)
                    );

                    renderStartTimeBlocks();
                    renderEndTimeBlocks();
                    updateSelectedTimeSummary();
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("startTimeBlocks").innerText =
                        "예약 현황을 불러오지 못했습니다.";
                });
        }

        function findReservationForSlot(slotStart, slotEnd) {
            return currentFacilityReservations.find(reservation =>
                overlaps(
                    slotStart,
                    slotEnd,
                    reservation.startTime,
                    reservation.endTime
                )
            );
        }

        function renderStartTimeBlocks() {
            const container = document.getElementById("startTimeBlocks");
            container.innerHTML = "";

            for (let hour = 9; hour < 19; hour++) {
                const start = hourText(hour);
                const end = hourText(hour + 1);
                const reservation = findReservationForSlot(start, end);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "time-block";

                if (reservation) {
                    button.disabled = true;
                    button.textContent =
                        start
                        + "\n" + reservation.reservationUserName + " 예약";
                } else {
                    button.textContent = start;

                    if (selectedStartTime === start) {
                        button.classList.add("selected");
                    }

                    button.onclick = function () {
                        selectedStartTime = start;
                        selectedEndTime = "";

                        renderStartTimeBlocks();
                        renderEndTimeBlocks();
                        updateSelectedTimeSummary();
                    };
                }

                container.appendChild(button);
            }
        }

        function renderEndTimeBlocks() {
            const container = document.getElementById("endTimeBlocks");
            container.innerHTML = "";

            for (let hour = 10; hour <= 19; hour++) {
                const end = hourText(hour);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "time-block";
                button.textContent = end;

                if (selectedStartTime === "") {
                    button.disabled = true;
                    container.appendChild(button);
                    continue;
                }

                if (timeToMinutes(end) <= timeToMinutes(selectedStartTime)) {
                    button.disabled = true;
                    container.appendChild(button);
                    continue;
                }

                const conflict = currentFacilityReservations.find(reservation =>
                    overlaps(
                        selectedStartTime,
                        end,
                        reservation.startTime,
                        reservation.endTime
                    )
                );

                if (conflict) {
                    button.disabled = true;
                    button.textContent =
                        end + "\n" + conflict.reservationUserName + " 예약과 겹침";
                } else {
                    if (selectedEndTime === end) {
                        button.classList.add("selected");
                    }

                    button.onclick = function () {
                        selectedEndTime = end;
                        renderEndTimeBlocks();
                        updateSelectedTimeSummary();
                    };
                }

                container.appendChild(button);
            }
        }

        function updateSelectedTimeSummary() {
            const summary = document.getElementById("selectedTimeSummary");

            if (selectedStartTime === "") {
                summary.innerText = "시간을 선택해주세요.";
            } else if (selectedEndTime === "") {
                summary.innerText =
                    "시작 시간: " + selectedStartTime + " / 끝나는 시간을 선택해주세요.";
            } else {
                summary.innerText =
                    "선택 시간: " + selectedStartTime + " ~ " + selectedEndTime;
            }
        }


        // ==================================================
        // 예약
        // ==================================================

        function addReservation() {
            // HTML에서 예약 정보 읽기
            const name =
                document.getElementById(
                    "nameInput"
                ).value;


            const facilityId =
                document.getElementById(
                    "facilitySelect"
                ).value;


            const date =
                document.getElementById(
                    "reservationDate"
                ).value;


            const startTime = selectedStartTime;
            const endTime = selectedEndTime;



            // 입력 확인
            if (
                name === "" ||
                facilityId === "" ||
                date === "" ||
                startTime === "" ||
                endTime === ""
            ) {
                document.getElementById(
                    "reservationResult"
                ).innerText =
                    "예약 정보를 모두 입력해주세요.";

                return;
            }



            // ==============================================
            // 이름 → User ID 조회
            //
            // GET /users/id?name=홍길동
            // ==============================================

            fetch(
                "/users/id-by-name?username="
                + encodeURIComponent(name)
            )

                .then(response => {

                    if (!response.ok) {
                        throw new Error(
                            "USER_NOT_FOUND"
                        );
                    }


                    // 서버가 long 값 하나를 반환
                    return response.json();
                })


                // ==============================================
                // User ID 조회 성공
                // → 예약 POST 요청
                // ==============================================

                .then(userId => {

                    return fetch(
                        "/reservation",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                userId:
                                    Number(userId),

                                facilityId:
                                    Number(facilityId),

                                date:
                                    date,

                                startTime:
                                    startTime,

                                endTime:
                                    endTime
                            })
                        }
                    );

                })


                // ==============================================
                // 예약 결과 처리
                // ==============================================

                .then(response => {

                    if (response.ok) {
                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "예약이 완료되었습니다.";

                        loadTimeBlocks();
                    }
                    else {
                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "예약에 실패했습니다.";
                    }

                })


                // ==============================================
                // User가 없거나 통신 실패
                // ==============================================

                .catch(error => {

                    if (
                        error.message ===
                        "USER_NOT_FOUND"
                    ) {
                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "등록되지 않은 사용자입니다. 회원가입을 진행해주세요.";


                        // 입력한 이름을
                        // 회원가입 칸에 자동으로 넣기
                        document.getElementById(
                            "newNameInput"
                        ).value =
                            name;
                    }
                    else {
                        console.error(
                            "예약 오류:",
                            error
                        );


                        document.getElementById(
                            "reservationResult"
                        ).innerText =
                            "서버 요청 중 오류가 발생했습니다.";
                    }

                });
        }



        // ==================================================
        // 회원가입
        //
        // POST /users
        // ==================================================

        function newMemberShip() {
            const name =
                document.getElementById(
                    "newNameInput"
                ).value;


            const age =
                document.getElementById(
                    "age"
                ).value;



            if (
                name === "" ||
                age === ""
            ) {
                document.getElementById(
                    "registerResult"
                ).innerText =
                    "이름과 나이를 입력해주세요.";

                return;
            }



            fetch(
                "/users",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        name:
                            name,

                        age:
                            Number(age)
                    })
                }
            )

                .then(response => {

                    if (response.ok) {
                        document.getElementById(
                            "registerResult"
                        ).innerText =
                            "회원가입 성공";


                        // 가입한 이름을
                        // 예약자 이름 칸에 자동으로 넣기
                        document.getElementById(
                            "nameInput"
                        ).value =
                            name;
                    }
                    else {
                        document.getElementById(
                            "registerResult"
                        ).innerText =
                            "회원가입 실패";
                    }

                })

                .catch(error => {

                    console.error(
                        "회원가입 오류:",
                        error
                    );


                    document.getElementById(
                        "registerResult"
                    ).innerText =
                        "서버 요청 자체가 실패했습니다.";

                });
        }



        // ==========================================
// 선택한 날짜의 예약 목록 조회
// ==========================================

function loadReservationsByDate()
{
    const date =
        document.getElementById("cancelDate").value;

    const list =
        document.getElementById("reservationList");


    // 기존 목록 초기화
    list.innerHTML = "";


    if (date === "")
    {
        return;
    }


    fetch("/reservation/" + date)

        .then(response => {

            if (!response.ok)
            {
                throw new Error("예약 조회 실패");
            }

            return response.json();
        })

        .then(data => {

            // 해당 날짜에 예약이 하나도 없는 경우
            if (data.length === 0)
            {
                list.innerText =
                    "해당 날짜에 예약이 없습니다.";

                return;
            }


            data.forEach(reservation => {

                // 이미 취소된 예약은 표시하지 않음
                if (reservation.status === "CANCELLED")
                {
                    return;
                }


                const button =
                    document.createElement("button");


                // 화면에 표시할 내용
                button.textContent =
                    reservation.reservationFacilityName
                    + " / "
                    + reservation.reservationUserName
                    + " / "
                    + reservation.startTime
                    + " : "
                    + reservation.endTime


                // 버튼 클릭 → 해당 예약 취소
                button.onclick = function()
                {
                    cancelReservation(
                        reservation.reservationId
                    );
                };


                list.appendChild(button);
                list.appendChild(
                    document.createElement("br")
                );
            });

        })

        .catch(error => {

            console.error(error);

            list.innerText =
                "예약 목록을 불러오지 못했습니다.";

        });
}



// ==========================================
// 예약 취소
// ==========================================

function cancelReservation(reservationId)
{
    const result =
        document.getElementById("cancelResult");


    fetch(
        "/reservation/" + reservationId,
        {
            method: "DELETE"
        }
    )

    .then(response => {

        if (response.ok)
        {
            result.innerText =
                "예약이 취소되었습니다.";


            // 취소 후 목록 다시 불러오기
            loadReservationsByDate();
        }
        else
        {
            result.innerText =
                "예약 취소에 실패했습니다.";
        }

    })

    .catch(error => {

        console.error(error);

        result.innerText =
            "서버 요청 중 오류가 발생했습니다.";

    });
}
    </script>

</body>

</html>
