# 테스트 전용 설정 (src/main/resources/application.properties 대신 사용됨)
# MySQL 없이 H2 인메모리 DB(MySQL 호환 모드)로 실행한다.
spring.application.name=reservation-test

spring.datasource.url=jdbc:h2:mem:reservation_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 메일은 실제로 보내지 않는다 (테스트에서는 JavaMailSender를 호출하지 않거나 목으로 대체)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
