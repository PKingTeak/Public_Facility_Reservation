# 테스트 전용 설정 (src/main/resources/application.properties 대신 사용됨)
# 기본은 H2 인메모리 DB. MySQL로 돌리고 싶으면 실행 시 아래 값을 -D 옵션으로 덮어쓰면 된다.
spring.application.name=reservation
spring.datasource.url=jdbc:h2:mem:reservation_test;MODE=MySQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 동시 요청 100건을 받기 위해 커넥션 풀을 넉넉하게
spring.datasource.hikari.maximum-pool-size=20

# 테스트에서는 메일을 실제로 보내지 않음
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
